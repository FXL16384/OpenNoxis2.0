plugins {
    id 'fabric-loom' version '1.9.2'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' }
    maven { name = 'Meteor'; url = 'https://maven.meteordev.org/snapshots' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // ---- bundled libraries, shipped inside the jar (META-INF/jars) ----
    modImplementation files("libs/satin-2.0.0.jar")
    modImplementation files("libs/mixinextras-fabric-0.4.1.jar")

    implementation files("libs/skija-shared-0.93.6.jar")
    implementation files("libs/skija-windows-0.93.6.jar")
    implementation files("libs/lwjgl-nanovg-3.3.3.jar")
    implementation files("libs/lwjgl-nanovg-3.3.3-natives-windows.jar")

    // ---- optional runtime mods: compile-only ----
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}"
    modCompileOnly files("libs/sodium-fabric-0.6.13.jar")

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

loom {
    accessWidenerPath = file("src/main/resources/alien.accesswidener")
    mixin {
        defaultRefmapName = "Noxis-refmap.json"
    }
}

// Nested (jar-in-jar) libraries, exactly like the original build.
def nestedJars = [
        "lwjgl-nanovg-3.3.3-natives-windows.jar",
        "lwjgl-nanovg-3.3.3.jar",
        "mixinextras-fabric-0.4.1.jar",
        "satin-2.0.0.jar",
        "skija-shared-0.93.6.jar",
        "skija-windows-0.93.6.jar",
]

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    from("libs") {
        include nestedJars
        into "META-INF/jars"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
